<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日英バイリンガル字幕専用プレイヤー</title>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --primary: #2563eb;
      --border: #e2e8f0;
      --highlight: #dbeafe;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; max-width: 680px; margin: 0 auto; line-height: 1.5; }
    h1 { font-size: 1.15rem; font-weight: 700; margin-bottom: 12px; text-align: center; color: var(--text); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .card-title { font-weight: 600; font-size: 0.88rem; margin-bottom: 8px; color: #475569; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }

    .chip-container { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .chip {
      background: #f1f5f9; border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px;
      font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: 0.15s; color: #334155;
    }
    .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .accordion-toggle {
      width: 100%; text-align: left; background: #f8fafc; border: 1px solid var(--border);
      padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: 600;
      color: #1e293b; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    }
    .accordion-toggle:hover { background: #f1f5f9; }
    .accordion-toggle #accordionArrow { color: #64748b; font-size: 0.8rem; }

    .episode-list {
      max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px;
      margin-top: 6px; background: #fff; display: none;
    }
    .episode-list.open { display: block; }
    .episode-item {
      padding: 10px 14px; border-bottom: 1px solid #f1f5f9; font-size: 0.85rem; cursor: pointer;
      color: #334155; transition: 0.1s;
    }
    .episode-item:last-child { border-bottom: none; }
    .episode-item:hover { background: #eff6ff; color: var(--primary); }

    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; background: #000; margin-bottom: 8px; }
    .video-container iframe, .video-container #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .controls { display: flex; gap: 6px; flex-wrap: wrap; }

    button {
      background: var(--primary); color: white; border: none; border-radius: 6px; padding: 6px 12px;
      font-size: 0.82rem; font-weight: 500; cursor: pointer;
    }
    button.secondary { background: #f1f5f9; color: #334155; border: 1px solid var(--border); }
    button.secondary:hover { background: #e2e8f0; }

    /* 字幕リスト */
    .subtitle-list {
      max-height: 340px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px;
      padding: 8px; background: #fafafa;
    }
    .sub-item { padding: 8px 10px; border-radius: 6px; font-size: 0.95rem; cursor: pointer; margin-bottom: 4px; color: #1e293b; transition: 0.15s; }
    .sub-item:hover { background: #edf2f7; }
    .sub-item.active { background: var(--highlight); color: #1e40af; border-left: 4px solid var(--primary); font-weight: 600; }
    .sub-time { font-size: 0.75rem; color: #94a3b8; margin-right: 8px; }
    .sub-en { line-height: 1.4; transition: filter 0.2s; }
    .sub-ja { font-size: 0.82rem; color: #64748b; margin-top: 3px; font-weight: normal; }

    /* 翻訳非表示 */
    .hide-ja .sub-ja { display: none !important; }

    /* ディクテーション用ぼかし機能（ホバーやタップで一時解除） */
    .blur-en .sub-en {
      filter: blur(5px);
      user-select: none;
    }
    .blur-en .sub-item:hover .sub-en,
    .blur-en .sub-item:active .sub-en {
      filter: none;
      user-select: auto;
    }

    .history-list { font-size: 0.82rem; }
    .history-item { padding: 7px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <h1>🎧 日英バイリンガル字幕専用プレイヤー</h1>

  <!-- 1. 番組選択 -->
  <div class="card">
    <div class="card-title">1. 番組を選ぶ</div>
    <div class="chip-container" id="seriesChips">
      <span style="font-size:0.82rem; color:#94a3b8;">読み込み中...</span>
    </div>
  </div>

  <!-- 2. エピソード一覧 -->
  <div class="card" id="episodeSection" style="display:none;">
    <button class="accordion-toggle" onclick="toggleEpisodeList()">
      <span id="currentEpisodeLabel">エピソードを選択してください</span>
      <span id="accordionArrow">▼</span>
    </button>
    <div class="episode-list" id="episodeList"></div>
  </div>

  <!-- 3. YouTube 再生 -->
  <div class="card">
    <div class="video-container">
      <div id="player"></div>
    </div>
    <div class="controls">
      <button class="secondary" onclick="repeatSentence()">🔁 この文を頭から</button>
      <button class="secondary" onclick="skipSec(-3)">⏪ 3秒戻る</button>
      <button class="secondary" onclick="skipSec(3)">3秒進む ⏩</button>
      <button class="secondary" id="speedBtn" onclick="toggleSpeed()">速度: 1.0x</button>
    </div>
  </div>

  <!-- 4. 字幕 -->
  <div class="card">
    <div class="card-title">
      <span id="subCount">字幕スクリプト</span>
      <div style="display: flex; gap: 6px;">
        <button class="secondary" id="toggleBlurBtn" onclick="toggleBlurSubtitles()">📝 字幕: 表示</button>
        <button class="secondary" id="toggleJaBtn" onclick="toggleTranslation()">🌐 翻訳: ON</button>
      </div>
    </div>
    <div class="subtitle-list" id="subtitleList">
      <div style="color:#94a3b8; font-size:0.85rem; padding:8px;">エピソードを選択すると字幕が表示されます。</div>
    </div>
  </div>

  <!-- 5. 履歴 -->
  <div class="card">
    <div class="card-title">
      <span>最近聴いたエピソード</span>
      <button class="secondary" style="font-size:0.75rem; padding:2px 6px;" onclick="clearHistory()">クリア</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <script>
    const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR401NUuwwGjXjMUnjjUt6iG0eCcr8OwNWQygleopLWulhxFjBIPa5anr5Xb70RohJrsk_k9uVNtC2f/pub?gid=0&single=true&output=csv";

    let ytPlayer = null;
    let isPlayerReady = false;
    let pendingVideoId = null;
    let allEpisodes = [];
    let currentSeries = "";
    let sentences = [];
    let currentSentenceIdx = -1;
    let timeTrackingTimer = null;
    let showTranslation = true;
    let blurSubtitles = false;

    function getValue(obj, targetKey) {
      if (!obj) return "";
      const searchKey = targetKey.toLowerCase().trim();
      for (const k in obj) {
        if (k.toLowerCase().trim() === searchKey) {
          return obj[k] !== undefined && obj[k] !== null ? String(obj[k]).trim() : "";
        }
      }
      return "";
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderHistory();
      Papa.parse(SPREADSHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          allEpisodes = results.data;
          renderSeriesChips();
        },
        error: function(err) {
          alert("スプレッドシートの取得に失敗しました。");
        }
      });
    });

    function renderSeriesChips() {
      const container = document.getElementById('seriesChips');
      const seriesList = [...new Set(allEpisodes.map(ep => getValue(ep, 'series')).filter(Boolean))];

      if (seriesList.length === 0) {
        container.innerHTML = '<span style="font-size:0.82rem; color:#94a3b8;">番組データがありません。</span>';
        return;
      }

      container.innerHTML = seriesList.map(s => `
        <div class="chip ${s === currentSeries ? 'active' : ''}" onclick="selectSeries('${s.replace(/'/g, "\\'")}')">${s}</div>
      `).join('');

      if (!currentSeries && seriesList.length > 0) {
        selectSeries(seriesList[0]);
      }
    }

    function selectSeries(seriesName) {
      currentSeries = seriesName;
      renderSeriesChips();

      const epSection = document.getElementById('episodeSection');
      epSection.style.display = 'block';

      const listContainer = document.getElementById('episodeList');
      const filtered = allEpisodes.filter(ep => getValue(ep, 'series') === seriesName);

      listContainer.innerHTML = filtered.map(ep => {
        const title = getValue(ep, 'title') || '無題';
        const globalIdx = allEpisodes.indexOf(ep);
        return `
          <div class="episode-item" onclick="selectEpisodeByIndex(${globalIdx})">
            ${title}
          </div>
        `;
      }).join('');

      openEpisodeList();
    }

    function toggleEpisodeList() {
      const list = document.getElementById('episodeList');
      const arrow = document.getElementById('accordionArrow');
      list.classList.toggle('open');
      arrow.innerText = list.classList.contains('open') ? '▲' : '▼';
    }
    function openEpisodeList() {
      document.getElementById('episodeList').classList.add('open');
      document.getElementById('accordionArrow').innerText = '▲';
    }
    function closeEpisodeList() {
      document.getElementById('episodeList').classList.remove('open');
      document.getElementById('accordionArrow').innerText = '▼';
    }

    function selectEpisodeByIndex(idx) {
      const ep = allEpisodes[idx];
      playEpisodeData(ep);
      saveToHistory(ep);
    }

    function playEpisodeData(ep) {
      const series = getValue(ep, 'series');
      const title = getValue(ep, 'title');
      const rawUrl = getValue(ep, 'url');
      const rawTranscript = getValue(ep, 'transcript');

      document.getElementById('currentEpisodeLabel').innerText = series ? `${series} - ${title}` : title;
      closeEpisodeList();

      const videoId = extractVideoId(rawUrl);
      if (videoId) {
        if (isPlayerReady && ytPlayer && ytPlayer.loadVideoById) {
          ytPlayer.loadVideoById(videoId);
        } else {
          pendingVideoId = videoId;
        }
      }

      parseSubtitles(rawTranscript);
    }

    function parseSubtitles(rawText) {
      const list = document.getElementById('subtitleList');
      if (!rawText) {
        list.innerHTML = '<div style="color:#ef4444; font-size:0.85rem; padding:8px;">字幕データが見つかりませんでした。</div>';
        return;
      }

      const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
      sentences = [];
      currentSentenceIdx = -1;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const timeMatch = line.match(/\[?(\d{1,2}:)?\d{1,2}:\d{2}([.,]\d{1,3})?\]?/);

        if (timeMatch) {
          const timeStr = timeMatch[0].replace(/[\[\]]/g, '');
          const sec = timeToSeconds(timeStr);
          let rest = line.replace(timeMatch[0], '').trim();
          let en = rest;
          let ja = '';

          if (rest.includes('|')) {
            const parts = rest.split('|');
            en = parts[0].trim();
            ja = parts.slice(1).join('|').trim();
          }

          if (en) sentences.push({ start: sec, text: en, translation: ja });
        }
      }

      for (let i = 0; i < sentences.length; i++) {
        sentences[i].end = (i < sentences.length - 1) ? sentences[i+1].start : sentences[i].start + 4;
      }

      renderSubtitles();
    }

    function renderSubtitles() {
      const list = document.getElementById('subtitleList');
      document.getElementById('subCount').innerText = `字幕スクリプト (${sentences.length} 文)`;
      list.innerHTML = '';

      sentences.forEach((s, idx) => {
        const div = document.createElement('div');
        div.className = 'sub-item';
        div.id = `sub-${idx}`;
        div.innerHTML = `
          <div class="sub-en"><span class="sub-time">${formatTime(s.start)}</span>${escapeHtml(s.text)}</div>
          ${s.translation ? `<div class="sub-ja">${escapeHtml(s.translation)}</div>` : ''}
        `;
        div.onclick = () => {
          if (isPlayerReady && ytPlayer && ytPlayer.seekTo) {
            ytPlayer.seekTo(s.start, true);
            ytPlayer.playVideo();
          }
        };
        list.appendChild(div);
      });
    }

    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: '',
        playerVars: { 'playsinline': 1, 'rel': 0 },
        events: {
          'onReady': () => {
            isPlayerReady = true;
            if (pendingVideoId) {
              ytPlayer.loadVideoById(pendingVideoId);
              pendingVideoId = null;
            }
          },
          'onStateChange': (e) => {
            if (e.data === YT.PlayerState.PLAYING) {
              if (!timeTrackingTimer) timeTrackingTimer = setInterval(trackSubtitles, 250);
            } else {
              clearInterval(timeTrackingTimer);
              timeTrackingTimer = null;
            }
          }
        }
      });
    };

    function extractVideoId(url) {
      if (!url) return null;
      const clean = url.trim();
      const match = clean.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([\w-]{11})/);
      return match ? match[1] : null;
    }

    function skipSec(sec) {
      if (!isPlayerReady || !ytPlayer || !ytPlayer.getCurrentTime) return;
      ytPlayer.seekTo(Math.max(0, ytPlayer.getCurrentTime() + sec), true);
    }

    function repeatSentence() {
      if (!isPlayerReady || !ytPlayer) return;
      if (currentSentenceIdx >= 0 && sentences[currentSentenceIdx]) {
        ytPlayer.seekTo(sentences[currentSentenceIdx].start, true);
        ytPlayer.playVideo();
      } else {
        skipSec(-3);
      }
    }

    const speeds = [1.0, 0.8, 0.6, 1.2];
    let speedIdx = 0;
    function toggleSpeed() {
      if (!isPlayerReady || !ytPlayer || !ytPlayer.setPlaybackRate) return;
      speedIdx = (speedIdx + 1) % speeds.length;
      const rate = speeds[speedIdx];
      ytPlayer.setPlaybackRate(rate);
      document.getElementById('speedBtn').innerText = `速度: ${rate.toFixed(1)}x`;
    }

    function trackSubtitles() {
      if (!isPlayerReady || !ytPlayer || !ytPlayer.getCurrentTime || sentences.length === 0) return;
      const current = ytPlayer.getCurrentTime();

      for (let i = 0; i < sentences.length; i++) {
        const item = sentences[i];
        if (current >= item.start && current < item.end) {
          if (currentSentenceIdx !== i) {
            currentSentenceIdx = i;
            const el = document.getElementById(`sub-${i}`);
            if (el) {
              document.querySelectorAll('.sub-item.active').forEach(it => it.classList.remove('active'));
              el.classList.add('active');
              el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
          }
          break;
        }
      }
    }

    // 翻訳の表示/非表示トグル
    function toggleTranslation() {
      showTranslation = !showTranslation;
      const list = document.getElementById('subtitleList');
      const btn = document.getElementById('toggleJaBtn');
      if (showTranslation) {
        list.classList.remove('hide-ja');
        btn.innerText = '🌐 翻訳: ON';
      } else {
        list.classList.add('hide-ja');
        btn.innerText = '🌐 翻訳: OFF';
      }
    }

    // 字幕のぼかしトグル（ディクテーション用）
    function toggleBlurSubtitles() {
      blurSubtitles = !blurSubtitles;
      const list = document.getElementById('subtitleList');
      const btn = document.getElementById('toggleBlurBtn');
      if (blurSubtitles) {
        list.classList.add('blur-en');
        btn.innerText = '🙈 字幕: ぼかし中';
      } else {
        list.classList.remove('blur-en');
        btn.innerText = '📝 字幕: 表示';
      }
    }

    function timeToSeconds(t) {
      const clean = t.replace(',', '.');
      const parts = clean.split(':').map(Number);
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      if (parts.length === 2) return parts[0] * 60 + parts[1];
      return 0;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function saveToHistory(ep) {
      const url = getValue(ep, 'url');
      let history = JSON.parse(localStorage.getItem('yt_bilingual_history') || '[]');
      history = history.filter(h => getValue(h, 'url') !== url);
      history.unshift({
        series: getValue(ep, 'series'),
        title: getValue(ep, 'title'),
        url: url,
        transcript: getValue(ep, 'transcript'),
        date: new Date().toLocaleDateString([], { month: 'numeric', day: 'numeric' })
      });
      if (history.length > 10) history.pop();
      localStorage.setItem('yt_bilingual_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('yt_bilingual_history') || '[]');
      const container = document.getElementById('historyList');
      if (history.length === 0) {
        container.innerHTML = '<span style="color:#94a3b8;">まだ再生履歴がありません。</span>';
        return;
      }
      container.innerHTML = history.map(h => `
        <div class="history-item">
          <div>
            <strong>${escapeHtml(h.title)}</strong>
            <div style="font-size:0.75rem; color:#64748b;">${escapeHtml(h.series)} · ${h.date}</div>
          </div>
          <button class="secondary" onclick='playEpisodeData(${JSON.stringify(h).replace(/'/g, "&#39;")})'>▶ もう一度聴く</button>
        </div>
      `).join('');
    }

    function clearHistory() {
      if (confirm('再生履歴をクリアしますか？')) {
        localStorage.removeItem('yt_bilingual_history');
        renderHistory();
      }
    }
  </script>
</body>
</html>
